plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('createMinecraftArtifacts') {
    dependsOn 'generateModMetadata'
}

// 无头运行：不启动游戏，直接测 MC 真实 pipeline（CipherEncoder/Decoder + 压缩）在各包长下的吞吐
tasks.register('localBench', JavaExec) {
    group = 'verification'
    description = 'Headless pipeline benchmark (AES/CFB8 vs AES/CTR, small vs large packets)'
    // MC 与 Netty 在 main.compileClasspath 里（ModDevGradle 只给 main 挂了 Minecraft 依赖）
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'io.github.pasze888.netbench.tools.LocalBenchMain'
    jvmArgs '-Dstdout.encoding=UTF-8', '-Dfile.encoding=UTF-8'
}

tasks.named('test') {
    failOnNoDiscoveredTests = false
}

